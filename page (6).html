    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #0f0f0f;
      --card-bg:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #6c63ff;
      --text:     #e0e0e0;
      --muted:    #888;
      --radius:   12px;
    }

    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
    }

    /* ===== 标题 ===== */
    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      text-align: center;
      margin-bottom: 50px;
    }

    .page-title .highlight {
      background: linear-gradient(135deg, var(--accent), #ff6584);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== 作品区域 ===== */
    .works-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
    }

    .work-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .work-card:hover {
      border-color: var(--accent);
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(108,99,255,0.15);
    }

    .work-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .work-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    .work-thumb-icon { font-size: 3rem; opacity: 0.2; position: relative; z-index: 1; }

    .work-body { padding: 22px; }

    .work-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* ===== 空占位卡片 ===== */
    .work-card-empty {
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      gap: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .work-card-empty:hover { transform: none; box-shadow: none; border-color: var(--accent); }

    .work-card-empty .plus-icon {
      width: 44px; height: 44px;
      border: 2px dashed var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--accent);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      body { padding: 40px 16px; }
      .works-grid { grid-template-columns: 1fr; }
    }
  </style>
